<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AB1 CanvasGraph smoke</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: sans-serif; }
    #stage { position: relative; width: 100%; height: calc(100% - 40px); }
    canvas { display: block; width: 100%; height: 100%; background: #1e293b; }
    #status { padding: 8px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="status">AB1 smoke — pan/zoom the canvas. Expect 12 nodes + links.</div>
  <div id="stage"><canvas id="cg"></canvas></div>
  <script src="/vendor.js"></script>
  <script src="/widget.js"></script>
  <script>
    (function () {
      const nodes = [];
      const links = [];
      for (let i = 0; i < 12; i++) {
        nodes.push({ id: 'n' + i, label: 'n' + i, group: 'entity', colour: '#38bdf8', r: 10 });
        if (i > 0) links.push({ source: 'n' + (i - 1), target: 'n' + i, role: 'had' });
      }
      const api = window.Viz.CanvasGraph.create({
        canvas: '#cg',
        nodes: nodes,
        links: links,
        variant: 'default',
        nodeDisplay: 'circles',
      });
      document.getElementById('status').textContent +=
        ' | CanvasGraph OK | destroy=' + typeof api.destroy +
        ' | transform=' + JSON.stringify(api.getTransform());
      window.__ab1Api = api;
    })();
  </script>
</body>
</html>
